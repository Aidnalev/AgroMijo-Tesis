<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AgroMijo - Consulta de reportes
    </title>

    <link rel="stylesheet"
          href="css/styles.css">

</head>


<body>

    <!-- =========================================
         ENCABEZADO
         ========================================= -->

    <header class="main-header">

        <div class="header-content">

            <div>

                <h1>
                    AgroMijo
                </h1>

                <p>
                    Consulta de reportes de partidas
                </p>

            </div>

        </div>

    </header>


    <!-- =========================================
         CONTENIDO PRINCIPAL
         ========================================= -->

    <main class="main-container">


        <!-- =====================================
             BÚSQUEDA
             ===================================== -->

        <section class="search-section">

            <div class="section-header">

                <h2>
                    Buscar reportes
                </h2>

                <p>
                    Consulta las partidas registradas
                    por perfil o por rango de fechas.
                </p>

            </div>


            <div class="search-form">

                <div class="form-group">

                    <label for="profileId">
                        ID del perfil
                    </label>

                    <input type="text"
                           id="profileId"
                           placeholder="Ej. RF-8574">

                </div>


                <div class="form-group">

                    <label for="dateFrom">
                        Desde
                    </label>

                    <input type="date"
                           id="dateFrom">

                </div>


                <div class="form-group">

                    <label for="dateTo">
                        Hasta
                    </label>

                    <input type="date"
                           id="dateTo">

                </div>


                <div class="search-actions">

                    <button id="searchButton"
                            class="primary-button">
                        Buscar
                    </button>

                    <button id="clearButton"
                            class="secondary-button">
                        Limpiar
                    </button>

                </div>

            </div>


            <div id="message"
                 class="message">
            </div>

        </section>


        <!-- =====================================
             RESULTADOS
             ===================================== -->

        <section id="resultsSection"
                 class="results-section hidden">

            <div class="section-header results-header">

                <div>

                    <h2>
                        Partidas encontradas
                    </h2>

                    <p id="resultsSummary">
                    </p>

                </div>


                <div class="comparison-controls">

                    <span id="comparisonStatus"
                          class="comparison-status">
                        Selecciona 2 partidas
                        para compararlas.
                    </span>

                    <button id="compareButton"
                            class="primary-button"
                            disabled>
                        Comparar partidas
                    </button>

                </div>

            </div>


            <div class="table-wrapper">

                <table class="reports-table">

                    <thead>

                        <tr>

                            <th class="comparison-cell">
                                Comparar
                            </th>

                            <th>
                                Perfil
                            </th>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Ciclos
                            </th>

                            <th>
                                Decisiones
                            </th>

                            <th>
                                Eventos
                            </th>

                            <th>
                                Cosechas
                            </th>

                            <th>
                                Presupuesto final
                            </th>

                            <th>
                                Detalle
                            </th>

                        </tr>

                    </thead>


                    <tbody id="reportsContainer">
                    </tbody>

                </table>

            </div>


            <div id="pagination"
                 class="pagination">
            </div>

        </section>


        <!-- =====================================
             DETALLE
             ===================================== -->

        <section id="detailSection"
                 class="detail-section hidden">

            <div class="detail-navigation">

                <button id="backButton"
                        class="secondary-button">
                    ← Volver a reportes
                </button>

            </div>


            <div id="reportDetail">
            </div>

        </section>


        <!-- =====================================
             COMPARACIÓN
             ===================================== -->

        <section id="comparisonSection"
                 class="comparison-section hidden">

            <div class="detail-navigation">

                <button id="backFromComparisonButton"
                        class="secondary-button">
                    ← Volver a reportes
                </button>

            </div>


            <div id="comparisonContent">
            </div>

        </section>

    </main>


    <!-- =========================================
         CHART.JS
         ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
